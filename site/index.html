<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qubitrefill has moved</title>
    <meta
      name="description"
      content="Qubitrefill has moved to its new GitHub Pages site."
    />
    <meta name="robots" content="noindex" />
    <link
      rel="canonical"
      href="https://quipnetwork.github.io/qubitrefill/"
    />
    <meta
      http-equiv="refresh"
      content="0; url=https://quipnetwork.github.io/qubitrefill/"
    />
    <script>
      const destination = new URL(
        "https://quipnetwork.github.io/qubitrefill/"
      );

      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination);
    </script>
  </head>
  <body>
    <p>
      Qubitrefill has moved to
      <a href="https://quipnetwork.github.io/qubitrefill/">
        quipnetwork.github.io/qubitrefill
      </a>.
    </p>
  </body>
</html>
